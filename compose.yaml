services:
  rou:
    image: ghcr.io/cptsamfalcon/rou-bot:latest
    container_name: rou-bot
    restart: unless-stopped
    network_mode: host
    # Host mode also publishes the optional dashboard on WEB_PORT (default 8787).
    env_file: .env
    environment:
      TZ: UTC
      NODE_OPTIONS: --dns-result-order=ipv4first
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: rou-tunnel
    restart: unless-stopped
    network_mode: host
    depends_on:
      - rou
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
